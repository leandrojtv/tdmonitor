version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: td-monitor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - td-monitor-network

  backend:
    platform: ${BACKEND_PLATFORM:-linux/amd64}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: td-monitor-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-3001}
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB}
      TERADATA_USERNAME: ${TERADATA_USERNAME}
      TERADATA_PASSWORD: ${TERADATA_PASSWORD}
      TERADATA_JDBC_DRIVER_CLASS: ${TERADATA_JDBC_DRIVER_CLASS:-com.teradata.jdbc.TeraDriver}
      TERADATA_JDBC_JAR_PATH: ${TERADATA_JDBC_JAR_PATH:-/opt/teradata/jdbc/terajdbc4.jar}
      TERADATA_TIMEOUT_MS: ${TERADATA_TIMEOUT_MS:-30000}
      CACHE_TTL_MINUTES: ${CACHE_TTL_MINUTES:-15}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    ports:
      - '${BACKEND_PORT:-3001}:3001'
    depends_on:
      - db
    volumes:
      - ./jdbc:/opt/teradata/jdbc:ro
    networks:
      - td-monitor-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001/api}
    container_name: td-monitor-frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-80}:80'
    depends_on:
      - backend
    networks:
      - td-monitor-network

volumes:
  postgres_data:

networks:
  td-monitor-network:
    driver: bridge
